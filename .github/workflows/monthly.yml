name: monthly-refresh

on:
  schedule:
    - cron: "23 2 25 * *"
  workflow_dispatch:
    inputs:
      aoi:
        description: Area as a GADM name path, e.g. Lamongan/Tikung (optional ISO3 prefix, e.g. IDN:)
        default: Lamongan/Tikung
      start:
        description: First month YYYY-MM (empty = previous month)
        default: ""
      end:
        description: Last month YYYY-MM (empty = same as start)
        default: ""
      deploy:
        description: Publish the site after the data is rebuilt
        type: boolean
        default: true

permissions: {}

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      AOI: ${{ inputs.aoi || 'Lamongan/Tikung' }} # inputs reach the shell only through env, never interpolated
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      BUCKET: tikungcrops-data
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 does not accept the newer default checksums of the AWS CLI. Remove these two lines when R2 does.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true

      - name: Validate inputs
        run: |
          # Letters, digits, space and / . ( ) _ - only; no quotes or shell metacharacters
          aoi_re='^([A-Z]{3}:)?[A-Za-z0-9][A-Za-z0-9 /.()_-]*$'
          [[ "$AOI" =~ $aoi_re ]] || { echo "bad aoi: $AOI"; exit 1; }
          for m in "$START" "$END"; do
            [[ -z "$m" || "$m" =~ ^[0-9]{4}-[0-9]{2}$ ]] || { echo "bad month: $m"; exit 1; }
          done

      - name: Install runtime dependencies
        run: uv sync --locked --no-dev

      # Silver and gold need every past month, so the history lives in the private R2 bucket.
      # `just r2-seed` uploads it once from the machine that holds it.
      - name: Restore the data history from R2
        run: |
          aws s3 sync "s3://$BUCKET/data/" data/ --endpoint-url "$R2_ENDPOINT" --only-show-errors
          compgen -G 'data/bronze/sentinel/*/cells.parquet' > /dev/null \
            || { echo "The R2 bucket has no history. Run just r2-seed first."; exit 1; }

      - name: Sentinel-1/2 bronze
        run: uv run --no-sync python -m tikungcrops.pipeline.load_sentinel "$AOI" "$START" "$END"

      # needs the cells table written by the Sentinel step
      - name: CHIRPS monthly rainfall
        run: uv run --no-sync python -m tikungcrops.pipeline.load_chirps "$AOI"

      - name: Silver
        run: uv run --no-sync python -m tikungcrops.pipeline.silver_sentinel "$AOI"

      - name: Gold
        run: uv run --no-sync python -m tikungcrops.pipeline.gold_sentinel "$AOI"

      - name: Harvest outlook
        run: uv run --no-sync python -m tikungcrops.pipeline.harvest_outlook "$AOI"

      - name: Web JSON
        run: uv run --no-sync python -m tikungcrops.pipeline.export_web "$AOI"

      # Only the bronze months and the soil tables are kept, because every later step can rebuild the rest.
      - name: Save the data history to R2
        run: |
          aws s3 sync data/bronze "s3://$BUCKET/data/bronze" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 sync data/silver/soilgrids "s3://$BUCKET/data/silver/soilgrids" --endpoint-url "$R2_ENDPOINT" --only-show-errors

      - name: Copy the web JSON into the site
        run: |
          rm -rf site/public/json
          mkdir -p site/public/json
          cp -r data/web/* site/public/json/

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Publish the site
        if: ${{ github.event_name == 'schedule' || inputs.deploy }}
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run deploy
