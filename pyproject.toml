[project]
name = "jotosanur-agri"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tri Rianto Utomo", email = "tri.r.utomo@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "copulas>=0.14.0",
    "doi2bib>=0.4.0",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pymongo>=4.18.1",
    "rasterio>=1.5.1",
    "scikit-learn>=1.9.1",
    "skrub>=0.11.0",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "hypothesis>=6.170.5",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["typings", "archives"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "D",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# test names say what they check
"tests/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
include = ["src", "app.py"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
