# The workflow passes the Markdown and Typst files.
# The site and data folders hold generated or draft pages, so they are skipped.
exclude_path = ["data", "site", ".venv", "node_modules"]
exclude = ["^https?://localhost", "^https?://127\\.0\\.0\\.1"]
accept = ["200..=299", "429"]
max_retries = 2
timeout = 20
