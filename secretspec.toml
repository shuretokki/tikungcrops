[project]
name = "tikungcrops"
revision = "1.0"

# Extend configurations from subdirectories
# extends = [ "subdir1", "subdir2" ]

[profiles.default]
# DATABASE_URL = { description = "Database connection string", required = true }
CLOUDFLARE_API_TOKEN = { description = "Wrangler token for Workers deploys and the R2 data bucket", required = true }
CLOUDFLARE_ACCOUNT_ID = { description = "Cloudflare account ID that owns the Worker and the R2 bucket", required = true }
MONGO_ROOT_USER = { description = "Root user for the local MongoDB container", required = false, default = "jotosanur" }
MONGO_ROOT_PASSWORD = { description = "Root password for the local MongoDB container", required = true }
MONGO_URI = { description = "MongoDB connection string, with the same password as MONGO_ROOT_PASSWORD", required = true }
MONGO_DB = { description = "Database name for the project", required = false, default = "jotosanur" }

# [profiles.development]
# Development profile inherits all secrets from default profile
# Only define secrets here that need different values or settings than default
# DATABASE_URL = { default = "sqlite:///dev.db" }
#
# New secrets
