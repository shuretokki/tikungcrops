tasks:
  site:
    cmd: ["just", "site-dev"]
    ready: {http: "http://localhost:3017"}
    tags: [web]
    autostart: true

  mongo:
    cmd: ["secretspec", "run", "--reason", "run the project database", "--", "docker", "compose", "up"]
    ready: {tcp: 27017, timeout: 60s}
    # compose exits by itself once its containers stop
    stop: {cmd: ["secretspec", "run", "--reason", "run the project database", "--", "docker", "compose", "stop"]}
    tags: [db]

  app:
    cmd: ["secretspec", "run", "--reason", "run the project database", "--", "uv", "run", "streamlit", "run", "app.py", "--server.headless", "true"]
    deps: [mongo]
    ready: {http: "http://localhost:8501"}
    tags: [web]

  export:
    type: job
    cmd: ["just", "web"]
    tags: [pipeline]
