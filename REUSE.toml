version = 1
SPDX-PackageName = "tikungcrops"
SPDX-PackageSupplier = "Tri Rianto Utomo"
SPDX-PackageDownloadLocation = "NOASSERTION"

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Tri Rianto Utomo"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "data/reference/**/*.csv"
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Tri Rianto Utomo (transcription)",
  "Source figures: Badan Pusat Statistik Kabupaten Lamongan, and Dinas Ketahanan Pangan dan Pertanian and Dinas Perikanan Kabupaten Lamongan, as cited in data/reference/README.md",
]
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["site/public/fonts/Lilex-Regular.ttf", "site/public/fonts/Lilex-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2019 The Lilex Project Authors (https://github.com/mishamyrt/Lilex)"
SPDX-License-Identifier = "OFL-1.1-no-RFN"

[[annotations]]
path = "site/app/assets/css/theme.css"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Tri Rianto Utomo", "2019 sainnhe (Everforest palette colors)"]
SPDX-License-Identifier = "Apache-2.0 AND MIT"

[[annotations]]
path = "documents/laporan/unesa.png"
precedence = "override"
SPDX-FileCopyrightText = "Universitas Negeri Surabaya"
SPDX-License-Identifier = "LicenseRef-UNESA-Logo"

[[annotations]]
path = [
  "site/eslint.config.mjs",
  "site/tsconfig.json",
  "site/.editorconfig",
  "site/.gitignore",
  "site/pnpm-workspace.yaml",
  "site/public/favicon.ico",
]
precedence = "override"
SPDX-FileCopyrightText = "2025 Nuxt UI Templates"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "site/public/desa/*.jpg"
precedence = "override"
SPDX-FileCopyrightText = "Contains modified Copernicus Sentinel data 2026, Sentinel-2 L2A true colour, enlarged and cut by scripts/desa_images.py"
SPDX-License-Identifier = "LicenseRef-Copernicus-Sentinel"

[[annotations]]
path = "site/app/data/desa-images.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Tri Rianto Utomo, with outlines from geoBoundaries (OCHA ROAP, BPS 2019)"
SPDX-License-Identifier = "CC-BY-3.0-IGO"


[[annotations]]
path = ["site/public/crops/padi.jpg", "site/public/crops/jagung.jpg", "site/public/crops/singkong.jpg"]
precedence = "override"
SPDX-FileCopyrightText = "Wikimedia Commons, resized"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "site/public/crops/kedelai.jpg"
precedence = "override"
SPDX-FileCopyrightText = "United Soybean Board, Wikimedia Commons, resized"
SPDX-License-Identifier = "CC-BY-2.0"

[[annotations]]
path = "site/public/crops/tebu.jpg"
precedence = "override"
SPDX-FileCopyrightText = "Sarah and Jason, Wikimedia Commons, resized"
SPDX-License-Identifier = "CC-BY-SA-2.0"

[[annotations]]
path = ["site/public/logo.png", "site/public/favicon.ico"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Tri Rianto Utomo, Heartland Harvest Emblem"
SPDX-License-Identifier = "LicenseRef-Project-Logo"
